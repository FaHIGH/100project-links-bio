b{display:grid;place-items:center;width:24px;height:24px;color:#888;transition:color .25s}
b svg{width:22px;height:22px}
a.tt:hover b{color:#25f4ee;filter:drop-shadow(1.5px 1.5px 0 #fe2c55)}
a.ig:hover svg{stroke:url(#ig)}
a.ig:hover svg circle:last-child{fill:#f58529}
a.fb:hover b{color:#1877f2}
a.yt:hover b{color:#f00}
.defs{position:absolute;width:0;height:0}
a i{margin-left:auto;font-style:normal;color:#555;transition:transform .25s,color .25s}
a:hover,a:focus-visible{padding-left:12px;outline:none}
a:hover i,a:focus-visible i{transform:translateX(6px);color:#fff}
.mail{width:100%;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit;cursor:pointer;text-align:left;font-size:13px;letter-spacing:.08em;text-transform:none;color:#aaa;}
.mail i{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:.2em;color:#555;text-transform:uppercase;transition:color .25s}
.mail:hover i,.mail:focus-visible i{color:#fff}
.mail:focus-visible{outline:none}
.mail.ok i{color:#4ade80}
footer{font-size:10px;letter-spacing:.3em;color:#444;text-transform:uppercase}
.stars,.stars:after{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:repeat;animation:twinkle 5s ease-in-out infinite alternate}

.stars:after{content:"";background-image:radial-gradient(1px 1px at 60px 90px,#fffc,transparent),radial-gradient(1.5px 1.5px at 190px 20px,#9db4ff,transparent),radial-gradient(1px 1px at 120px 210px,#fff9,transparent);background-size:340px 300px;animation-duration:7s;animation-delay:-3s}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.stars,.stars:after{animation:none}}
